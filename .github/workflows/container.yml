name: container

# Build packages/container/Containerfile with buildah for amd64 and publish it
# (as a manifest list, so arm64 can be re-added to the matrix later) to ghcr.io/<owner>/<repo>:
#   v* tag push  -> :<tag>               + :latest
#   branch push  -> :<branch>-<short-sha> + :<branch>   (e.g. develop-480e5df, develop)
# Branch names are sanitised for OCI tags (feature/fish -> feature-fish).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Newer pushes to the same branch supersede in-flight builds; tag builds always finish.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    permissions: {}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      alias: ${{ steps.tag.outputs.alias }}
    steps:
      - name: Compute image tags
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
            alias=latest
          else
            # OCI tags allow [A-Za-z0-9_.-], max 128 chars (leave room for -<sha>-<arch>)
            branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
            branch="${branch:0:100}"
            tag="${branch}-${GITHUB_SHA::7}"
            alias="$branch"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "Image tags: $tag, $alias" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.arch }})
    needs: meta
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure buildah
        run: command -v buildah || { sudo apt-get update && sudo apt-get install -y buildah; }

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | buildah login -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY"

      - name: Build
        env:
          # mise resolves "latest" via the GitHub API; avoid anonymous rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          buildah build \
            --file packages/container/Containerfile \
            --platform "linux/${ARCH}" \
            --secret id=github_token,env=GITHUB_TOKEN \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${TAG}" \
            --tag "${IMAGE}:${TAG}-${ARCH}" \
            .

      - name: Push
        run: buildah push "${IMAGE}:${TAG}-${ARCH}"

  manifest:
    needs: [meta, build]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      ALIAS: ${{ needs.meta.outputs.alias }}
    steps:
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | buildah login -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY"

      - name: Create and push manifest
        run: |
          buildah manifest create dotfiles
          for arch in amd64; do
            buildah manifest add dotfiles "docker://${IMAGE}:${TAG}-${arch}"
          done
          buildah manifest inspect dotfiles
          buildah manifest push --all dotfiles "docker://${IMAGE}:${TAG}"
          if [[ -n "$ALIAS" ]]; then
            buildah manifest push --all dotfiles "docker://${IMAGE}:${ALIAS}"
          fi
