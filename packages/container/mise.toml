# Container-only tools, installed as /etc/mise/config.toml by packages/container/Containerfile.
# These are layered on top of ~/.config/mise/config.toml (the host config), minus
# the heavy cloud tooling listed in MISE_DISABLE_TOOLS in the Containerfile.
[tools]
# Fedora's neovim lags; nvim-treesitter (main) needs >= 0.12
neovim = "latest"
starship = "latest"
zellij = "latest"
lazygit = "latest"
jj = "latest"    # Jujutsu VCS (container-only)
gh = "latest"    # GitHub CLI
glab = "latest"  # GitLab CLI (gitlab:gitlab-org/cli — releases live on gitlab.com)
yazi = "latest"
"github:agavra/tuicr" = "latest"
kubectl = "latest"
k9s = "latest"
