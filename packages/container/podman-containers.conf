# Rootless containers.conf for Podman-in-Podman (packages/container/Containerfile), installed
# as ~/.config/containers/containers.conf. Inner containers share the outer
# container's namespaces, and cgroups are disabled because a nested rootless
# container can't delegate them.
# From quay.io/podman/stable: https://github.com/containers/image_build/tree/main/podman
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
